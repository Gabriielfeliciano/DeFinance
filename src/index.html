<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>DeFinance</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Veja tokens, valor total e distribuição de qualquer carteira EVM em 17 redes: Ethereum, Arbitrum, Base, Polygon e outras.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Aplica o tema antes do Angular carregar (sem flash). Mesma regra do ThemeService.
    (function () {
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('definance-theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
        else if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
