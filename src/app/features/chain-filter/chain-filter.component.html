<div class="chips" role="group" aria-label="Filtrar por rede">
  <button
    type="button"
    class="chip"
    data-testid="chip-all"
    [class.chip--active]="selected() === 'all'"
    [attr.aria-pressed]="selected() === 'all'"
    (click)="selectedChange.emit('all')"
  >
    Todas <span class="count">{{ total() }}</span>
  </button>
  @for (chain of chains(); track chain) {
    <button
      type="button"
      class="chip"
      [attr.data-testid]="'chip-' + chain"
      [class.chip--active]="selected() === chain"
      [attr.aria-pressed]="selected() === chain"
      (click)="selectedChange.emit(chain)"
    >
      <span class="dot" [style.background]="'var(--chain-' + chain + ')'" aria-hidden="true"></span>
      {{ labels[chain] }} <span class="count">{{ counts()[chain] }}</span>
    </button>
  }
</div>
